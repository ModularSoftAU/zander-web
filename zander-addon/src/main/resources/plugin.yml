main: org.modularsoft.zander.addon.ZanderAddonMain
name: zander-addon
version: ${project.version}
author: ModularSoft
api-version: 1.21

commands:
  policy:
    description: View server policies.
    usage: /policy <tos|rules|privacy|refund>
  social:
    description: View our social media platforms.
    usage: /social
  pettrust:
    description: Manage trust settings for tamed pets.
    usage: /pettrust <trust|untrust|public|private|list|anchor|unanchor|help>
    aliases: [ptrust]

permissions:
  zanderaddon.pettrust.use:
    description: Allows players to manage trust for their own tamed pets.
    default: true
  zanderaddon.pettrust.admin:
    description: Allows admins to manage trust for any tamed pet.
    default: op
  zanderaddon.pettrust.bypass:
    description: Bypasses pet trust interaction restrictions entirely.
    default: op
