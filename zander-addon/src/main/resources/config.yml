# Zander Addon Configuration

# --- API Server Settings ---
# Enable the built-in API server
# If enabled, this server will host the /api/config/policy endpoint
api-server:
  enabled: true
  port: 8080

# --- Plugin Settings ---
# The base URL for the API (where the plugin fetches policy URLs from)
api-url: "https://craftingforchrist.net/api"

# Settings for the in-game policy book
policy-book:
  enabled: true
  slot: 8

# Settings for the social media paper
social-paper:
  enabled: true
  slot: 7

# --- Pet Trust Settings ---
petTrust:
  enabled: true

  # Default trust level granted when /pettrust trust <player> is run without a level argument.
  defaultTrustLevel: "ACCESS"

  # Range in blocks used to find the pet a player is looking at.
  targetRange: 6.0

  # If true, non-owners cannot damage pets unless allowed by trust and allowManagersToDamage.
  preventDamageWithoutManage: true

  # If false, even MANAGE-trusted players cannot damage pets — only owner/bypass can.
  allowManagersToDamage: false

  messages:
    prefix: "&6[PetTrust]&r "
    noPermission: "&cYou are not trusted to do that with this pet."
    noTarget: "&cLook at a tamed pet or ride one first."
    notOwner: "&cOnly the pet owner can change trust for this pet."
    featureDisabled: "&cPetTrust is currently disabled."

