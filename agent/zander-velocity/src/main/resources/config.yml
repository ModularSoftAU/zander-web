config-version: 3

BaseAPIURL: "http://localhost:8080/api"
APIKey: "KEY"

announcementMOTDTopLine: "&e&lMy &2&nMinecraft&r &6&oServer"
announcementTipPrefix: "&7&l[&6&lTIP&7&l]&r "
announcementTipInterval: 10

# Friends system: announce to a player's friends when they join the network.
# Server switches never trigger this; vanished players are never announced.
FriendsJoinAlerts: true

# When true, a staff member coming OUT of vanish retro-fires a join alert to
# their friends (via the VanishReporter poll). Off by default — coming back
# from vanish normally should not read as a fresh join.
FriendsJoinAlertsOnUnvanish: false
